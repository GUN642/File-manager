name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.VOID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VOID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using keystore from repository secrets"
          else
            echo "Using bundled signing key"
          fi

      - name: Build release APK
        env:
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/VOID-Files-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=out/VOID-Files-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VOID-Files-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: VOID Files ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: "true"
          body: |
            Automatischer Build von `${{ github.ref_name }}` (${{ github.sha }}).

            **Installation:** `VOID-Files-${{ steps.apk.outputs.version }}.apk` unten herunterladen und auf dem Handy öffnen.
          files: ${{ steps.apk.outputs.file }}
